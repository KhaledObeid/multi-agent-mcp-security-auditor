[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-mcp-security-auditor"
version = "0.1.0"
description = "Multi-agent security auditor for MCP servers and agent tools (COE748 project)"
# 3.14 is the newest Python with wheels for the whole stack. Python 3.15 is
# out, but onnxruntime (required by chromadb) has no 3.15 wheels yet. Lift the
# cap once it does.
requires-python = ">=3.14,<3.15"
dynamic = ["dependencies"]
readme = "README.md"

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mcp_security_auditor*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
